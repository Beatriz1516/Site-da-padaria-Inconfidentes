</head>
<body>
    <header>
        <!-- Menu -->    
        <nav class="navbar">

           <!-- Menu Lateral-->
            <div class="burger" id="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
           
            <ul class="nav-menu" id="navMenu">

                <li class="nav-item"><a href="../paginas/cadastro.html" class="nav-link">Cadastro</a></li>
                <li class="nav-item"><a href="../paginas/conta_cliente.html" class="nav-link">Conta</a></li>
            </ul>

            <!-- Logo da padaria -->
            <a href="./index.html"><div class="logo-container">

                <h3 class="subtitulo">Pão de Queijo<br> & <br> Café</h3>
            </div></a>

            <div class="carrinho">

        <div class="apresentacaoCadastro">
            <h3>Bem-vindo à Padaria Inconfidentes!</h3>
            <p>É um prazer sua presença novamente</p>
        </div>

        <form id="meuFormulario">
            <div class="contaDeUsuario">
                <p id="btnJaTenho" class="aba-opcao">Já tenho cadastro</p>
                <p id="btnNaoTenho" class="aba-opcao ativa">Não tenho cadastro</p>
            </div>

            <div id="grupoNome">
            <p class="instrucaoFormulario">Nome</p>
            <input type="text" id="nome" class="formularioCadastro" placeholder="Digite seu nome" required>
            </div>

            <p class="instrucaoFormulario">E-mail</p>
            <input type="email" id="email" class="formularioCadastro" placeholder="Digite seu email" required>

            <p id="labelSenha" class="instrucaoFormulario">Criar senha</p>
            <input type="password" id="senha" class="formularioCadastro" placeholder="Digite sua senha forte" required>


            <button type="submit" id="btnAcao">Criar conta</button>
        </form>
